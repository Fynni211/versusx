
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VersusX | Script Key System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body {
      background: linear-gradient(to bottom right, #0a0a0a, #1a1a1a);
      color: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    nav {
      width: 100%;
      background: #111;
      padding: 15px;
      display: flex;
      justify-content: center;
      border-bottom: 1px solid #333;
    }
    .tab {
      color: #aaa;
      margin: 0 20px;
      cursor: pointer;
      transition: 0.3s;
      font-size: 1.1em;
    }
    .tab.active {
      color: #ffffff;
      font-weight: bold;
      border-bottom: 2px solid #ff5500;
    }
    .container {
      margin-top: 60px;
      width: 90%;
      max-width: 800px;
      text-align: center;
      animation: fadeIn 1.2s ease;
    }
    h1 {
      font-size: 2.3em;
      margin-bottom: 20px;
      background: linear-gradient(to right, #ff003c, #ffa600);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .btn {
      padding: 14px 24px;
      font-size: 1em;
      border-radius: 8px;
      background: linear-gradient(135deg, #ff003c, #ffa600);
      color: white;
      border: none;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 0 10px #ff003c66;
    }
    .btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 20px #ffa600aa;
    }
    textarea {
      width: 100%;
      height: 250px;
      background: #181818;
      color: #eee;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 15px;
      font-size: 0.95em;
      margin-bottom: 20px;
      resize: none;
    }
    .footer {
      margin-top: auto;
      padding: 30px;
      text-align: center;
      font-size: 1em;
      color: #aaa;
    }
    .hidden { display: none; }
    input[type="text"] {
      padding: 12px;
      width: 60%;
      margin: 20px 0;
      border-radius: 8px;
      border: 1px solid #444;
      background: #111;
      color: white;
      font-size: 1em;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <nav>
    <div class="tab active" onclick="x('keyTab', this)">Get Key</div>
    <div class="tab" onclick="x('scriptTab', this)">Get Script</div>
  </nav>

  <div class="container" id="keyTab">
    <h1>VersusX Key System</h1>
    <p style="margin-bottom: 20px;">Du musst einen Key generieren, um das Script zu erhalten.</p>
    <button class="btn" onclick="y()">Get Key</button>

    <div id="codeSection" class="hidden">
      <p>Gib den Code ein, den du von Linkvertise erhalten hast:</p>
      <input type="text" id="userCode" placeholder="Code eingeben..." />
      <button class="btn" onclick="z()">Code prüfen</button>
    </div>

    <div id="finalKey" class="hidden">
      <h3>✅ Dein Key:</h3>
      <textarea id="keyOutput" readonly></textarea>
    </div>
  </div>

  <div class="container hidden" id="scriptTab">
    <h1>VersusX Script</h1>
    <textarea id="scriptBox" readonly>loadstring(game:HttpGet('https://gist.githubusercontent.com/Fynni211/a2fefcfb09cc118c674dce964695ec88/raw/b0d79b65ed7ea6bb72a8412fefe3b5ad144c699c/gistfile1.txt'))()</textarea>
    <button class="btn" onclick="w()">Copy Script</button>
  </div>

  <div class="footer">Made with ❤️ by Fynni</div>

  <script>
  (function(){
    const a="VERSUSX2025",b="https://gist.githubusercontent.com/Fynni211/928a5f4c7a2eb651d21da781f1a5c9b4/raw/d10f4411d7e3251b31b3325bf0589c4b0ad9eded/screttkey";
    window.x=function(c,d){document.querySelectorAll(".tab").forEach(e=>e.classList.remove("active"));d.classList.add("active");["keyTab","scriptTab"].forEach(f=>document.getElementById(f).classList.add("hidden"));document.getElementById(c).classList.remove("hidden")};
    window.y=function(){document.querySelector("#codeSection").classList.remove("hidden");window.open("https://link-hub.net/1344805/versus","_blank")};
    window.z=function(){
      const g=document.getElementById("userCode").value.trim();
      if(g===a){
        fetch(b).then(h=>h.text()).then(i=>{
          document.getElementById("finalKey").classList.remove("hidden");
          document.getElementById("keyOutput").value=i;
        }).catch(()=>{alert("❌ Fehler beim Abrufen des Keys von Pastebin.")});
      }else{alert("❌ Falscher Code. Bitte überprüfe deine Eingabe.")}};
    window.w=function(){
      const j=document.getElementById("scriptBox");
      j.select();j.setSelectionRange(0,99999);
      navigator.clipboard.writeText(j.value)
        .then(()=>alert("✅ Script copied to clipboard!"))
        .catch(()=>alert("❌ Copy failed."));
    };
  })();
  </script>

</body>
</html>
